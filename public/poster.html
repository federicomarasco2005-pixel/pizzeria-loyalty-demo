<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR da tavolo</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body { background: #fff; }
    .poster { max-width: 560px; margin: 24px auto; text-align: center; padding: 32px 24px; border: 3px solid var(--brand); border-radius: 28px; }
    .poster img.logo { width: 90px; height: 90px; }
    .poster h1 { font-size: 2.1rem; color: var(--brand); }
    .poster .big { font-size: 1.35rem; font-weight: 700; margin: 10px 0 18px; }
    .poster img.qr { width: 320px; max-width: 100%; }
    @media print { .noprint { display: none; } .poster { margin-top: 0; } }
  </style>
</head>
<body>
  <div class="poster">
    <img class="logo" src="/logo.png" alt="">
    <h1 data-cfg="pizzeriaName"></h1>
    <p class="big">Ogni <span data-cfg="stampsForReward"></span> visite:<br><span data-cfg="rewardText"></span> 🍕</p>
    <img class="qr" id="qr" alt="QR iscrizione">
    <p><strong>Inquadra e aggiungi la tessera al tuo Google Wallet.</strong><br>Nessuna app da scaricare.</p>
    <p class="muted small" id="url"></p>
  </div>
  <!-- Cartellino da mettere sopra/accanto all'adesivo NFC in cassa -->
  <div class="poster nfc-label" style="max-width:360px;padding:22px;page-break-before:always">
    <div style="font-size:4rem;line-height:1">📲</div>
    <h1 style="font-size:1.6rem;margin:8px 0">Avvicina qui il telefono</h1>
    <p class="big" style="font-size:1.05rem;margin:0">e ricevi subito il timbro della tua tessera 🍕</p>
    <div style="margin:16px auto 6px;width:120px;height:120px;border-radius:50%;border:4px dashed var(--brand);display:grid;place-items:center;font-weight:800;color:var(--brand)">NFC</div>
    <p class="muted small" style="margin:0">Android e iPhone · senza app</p>
  </div>
  <p class="noprint" style="text-align:center"><button class="btn" style="width:auto;padding:14px 32px" onclick="print()"><span class="ico">🖨️</span> Stampa</button></p>
  <script src="/common.js"></script>
  <script>
    applyBrand();
    api('/api/poster-qr').then((d) => {
      document.getElementById('qr').src = d.qr;
      document.getElementById('url').textContent = d.url;
    });
  </script>
</body>
</html>
