<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La mia tessera</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="wrap stack">
    <div id="notfound" class="panel hidden">
      <h2>Tessera non trovata</h2>
      <a class="btn" href="/"><span class="ico">🍕</span> Iscriviti</a>
    </div>

    <div id="card" class="hidden stack">
      <p class="muted" style="margin:0">Ciao <strong id="hello"></strong> 👋</p>

      <!-- Tessera: i timbri sono l'elemento principale -->
      <section class="passcard" id="pass">
        <div class="top">
          <img src="/logo.png" alt="">
          <strong data-cfg="pizzeriaName" style="flex:1"></strong>
          <span class="live" id="live">live</span>
        </div>

        <div class="stamps tiles" id="stamps"></div>

        <div class="pass-row">
          <div>
            <div class="pass-label">Timbri</div>
            <div class="pass-value"><span id="count">0</span> / <span id="total"></span></div>
          </div>
          <div id="reward" class="hidden"><span class="badge">🎁 <span id="rewardsN"></span> premio da ritirare</span></div>
        </div>

        <div class="pass-foot">
          <span data-cfg="pizzeriaName"></span>
          <span id="missing"></span>
        </div>
      </section>

      <a id="save" class="gwallet hidden" target="_blank" rel="noopener" aria-label="Aggiungi a Google Wallet">
        <img src="/wallet-button-it.svg" alt="Aggiungi a Google Wallet">
      </a>
      <p id="nowallet" class="muted small hidden">Google Wallet non configurato su questo server: salva questa pagina tra i preferiti.</p>

      <!-- QR in secondo piano: si apre solo in cassa -->
      <button class="btn dark" id="qrBtn"><span class="ico">▦</span> Mostra il QR in cassa</button>
      <section id="qrPanel" class="panel center hidden">
        <img id="qr" alt="QR della tessera" style="width:220px;height:220px">
        <div class="muted">oppure di' il codice in cassa</div>
        <div style="font-size:1.6rem;font-weight:800;letter-spacing:.08em" id="code"></div>
      </section>

      <a id="review" class="btn ghost hidden" target="_blank" rel="noopener">
        <span class="ico">⭐</span> Lascia una recensione su Google
      </a>

      <section id="news" class="panel hidden">
        <h2>📣 Dal locale</h2>
        <div id="messages" class="stack"></div>
      </section>
    </div>
  </main>

  <script src="/common.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const token = decodeURIComponent(location.pathname.split('/').pop());
    let cfg;
    let state = null; // { stamps, rewards }

    function paint(c, { animate = true } = {}) {
      $('count').textContent = c.stamps;
      $('total').textContent = c.stampsForReward;
      renderStamps($('stamps'), c.stamps, c.stampsForReward, { animate });
      const miss = c.stampsForReward - c.stamps;
      $('missing').textContent = miss === 1 ? 'Manca 1 timbro ›' : 'Mancano ' + miss + ' timbri ›';
      $('reward').classList.toggle('hidden', c.rewards < 1);
      $('rewardsN').textContent = c.rewards;
    }

    function celebrate(prev, next) {
      const n = next.stampsForReward;
      if (next.rewards > prev.rewards) {
        // Premio: si riempiono tutte le pizze, festa, poi si riparte da zero.
        paint({ ...next, stamps: n, rewards: prev.rewards });
        plusOne('🎉'); confetti(); vibrate([80, 60, 80, 60, 200]);
        toast('Premio sbloccato! ' + cfg.rewardText, 3500);
        setTimeout(() => {
          [...$('stamps').children].forEach((d) => d.classList.add('gone'));
          setTimeout(() => paint(next, { animate: false }), 420);
        }, 1800);
      } else if (next.stamps > prev.stamps) {
        paint(next);
        plusOne('+' + (next.stamps - prev.stamps)); bump($('count')); vibrate(80);
        $('pass').classList.remove('flash'); void $('pass').offsetWidth; $('pass').classList.add('flash');
        toast('Timbro aggiunto! 🍕');
      } else if (next.rewards < prev.rewards && next.stamps === prev.stamps) {
        paint(next, { animate: false });
        toast('Premio consegnato. Buon appetito! 🍕', 3000);
      } else {
        paint(next, { animate: false });
      }
    }

    function renderMessages(list) {
      $('news').classList.toggle('hidden', !list.length);
      $('messages').innerHTML = '';
      list.forEach((m) => {
        const d = document.createElement('div');
        d.className = 'msg';
        const t = document.createElement('strong'); t.textContent = m.title;
        const b = document.createElement('div'); b.textContent = m.body;
        const w = document.createElement('div'); w.className = 'small muted'; w.textContent = fmtDate(m.at);
        d.append(t, b, w);
        $('messages').appendChild(d);
      });
    }

    async function load() {
      try {
        const c = await api('/api/card/' + encodeURIComponent(token));
        const next = { stamps: c.stamps, rewards: c.rewards, stampsForReward: c.stampsForReward };
        if (!state) {
          $('card').classList.remove('hidden');
          $('hello').textContent = c.name;
          $('code').textContent = c.code;
          $('qr').src = c.qr;
          if (c.saveUrl) { $('save').href = c.saveUrl; $('save').classList.remove('hidden'); }
          else $('nowallet').classList.remove('hidden');
          paint(next, { animate: false });
          // Arrivati dal link "Mostra il QR per la cassa" del Wallet: QR già aperto
          if (new URLSearchParams(location.search).has('qr')) $('qrBtn').click();
        } else if (next.stamps !== state.stamps || next.rewards !== state.rewards) {
          celebrate(state, next);
        }
        state = next;
        if (c.reviewUrl) { $('review').href = c.reviewUrl; $('review').classList.remove('hidden'); }
        else $('review').classList.add('hidden');
        renderMessages(c.messages || []);
      } catch (err) {
        if (err.status === 404) $('notfound').classList.remove('hidden');
      }
    }

    $('qrBtn').onclick = () => {
      const open = $('qrPanel').classList.toggle('hidden') === false;
      $('qrBtn').lastChild.textContent = open ? ' Nascondi il QR' : ' Mostra il QR in cassa';
      if (open) $('qrPanel').scrollIntoView({ behavior: 'smooth', block: 'center' });
    };

    // Tempo reale: il server avvisa appena la cassa assegna un timbro o il locale manda un messaggio.
    function connect() {
      if (!window.EventSource) return;
      const es = new EventSource('/api/card/' + encodeURIComponent(token) + '/stream');
      es.onopen = () => $('live').classList.remove('off');
      es.onmessage = (e) => {
        try {
          const ev = JSON.parse(e.data);
          if (ev.type === 'message') { toast('📣 ' + ev.title, 4000); vibrate(120); }
        } catch {}
        load();
      };
      es.onerror = () => $('live').classList.add('off'); // EventSource si riconnette da solo
    }

    applyBrand().then((c) => {
      cfg = c;
      load().then(connect);
      setInterval(load, 15000); // rete di sicurezza se la connessione live cade
      document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
    });
  </script>
</body>
</html>
