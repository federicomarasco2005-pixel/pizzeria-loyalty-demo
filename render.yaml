# Blueprint Render: web service gratuito + Postgres gratuito (i dati sopravvivono ai riavvii).
# Nota: il Postgres gratuito di Render scade dopo 30 giorni — sufficiente per demo e primo test.
services:
  - type: web
    name: pizzeria-loyalty-demo
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/config
    # Dominio proprio (registrato su Aruba). Il vecchio indirizzo onrender.com resta attivo.
    domains:
      - f5m.it
      - www.f5m.it
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pizzeria-loyalty-db
          property: connectionString
      - key: PIZZERIA_NAME
        value: Pizzeria Da Mario
      - key: PROGRAM_NAME
        value: Tessera Amici della Pizza
      - key: REWARD_TEXT
        value: Una pizza margherita omaggio
      - key: STAMPS_FOR_REWARD
        value: "6"
      - key: BRAND_COLOR
        value: "#b3261e"
      - key: GOOGLE_CLASS_SUFFIX
        value: pizzeria_demo_v1
      - key: GOOGLE_ISSUER_ID
        value: "3388000000023194584"
      # Da inserire a mano su Render (segreti, non vanno nel repository):
      - key: GOOGLE_SA_JSON
        sync: false
      - key: STAFF_PIN
        sync: false
      # Bot Telegram per creare e gestire i locali (token di @BotFather)
      - key: TELEGRAM_BOT_TOKEN
        sync: false

databases:
  - name: pizzeria-loyalty-db
    plan: free
    region: frankfurt
