# Blueprint Render: web service gratuito + Postgres gratuito (i dati sopravvivono ai riavvii).
# Nota: il Postgres gratuito di Render scade dopo 30 giorni — sufficiente per demo e primo test.
services:
  - type: web
    name: pizzeria-loyalty-demo
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/config
    # Pubblica da solo solo se i test su GitHub passano (senza questa riga il Blueprint torna a "ogni commit")
    autoDeployTrigger: checksPass
    # Dominio proprio (registrato su Aruba). Il vecchio indirizzo onrender.com resta attivo.
    # f5m.it (Render aggiunge da solo www.f5m.it, che porta a f5m.it) e un sottodominio per ogni locale (*.f5m.it)
    domains:
      - f5m.it
      - "*.f5m.it"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pizzeria-loyalty-db
          property: connectionString
      # Indirizzi: f5m.it (pagina del servizio) e un sottodominio per ogni locale (es. da-mario.f5m.it).
      # QR, chip NFC e tessere già distribuiti con l'indirizzo onrender.com continuano a funzionare.
      - key: PUBLIC_URL
        value: https://f5m.it
      # Sottodomini dei locali (da-mario.f5m.it): da attivare quando Render ha il certificato di *.f5m.it.
      # Finché è spento i locali sono su f5m.it/<indirizzo>; all'attivazione le tessere si aggiornano da sole.
      # - key: SHOP_DOMAIN
      #   value: f5m.it
      - key: BRAND_NAME
        value: F5M
      - key: SUPPORT_EMAIL
        value: federico.marasco2005@gmail.com
      - key: PIZZERIA_NAME
        value: Pizzeria Da Mario
      - key: PROGRAM_NAME
        value: Tessera Amici della Pizza
      - key: REWARD_TEXT
        value: Una pizza margherita omaggio
      - key: STAMPS_FOR_REWARD
        value: "6"
      - key: BRAND_COLOR
        value: "#b3261e"
      - key: GOOGLE_CLASS_SUFFIX
        value: pizzeria_demo_v1
      - key: GOOGLE_ISSUER_ID
        value: "3388000000023194584"
      # Da inserire a mano su Render (segreti, non vanno nel repository):
      - key: GOOGLE_SA_JSON
        sync: false
      - key: STAFF_PIN
        sync: false
      # Bot Telegram per creare e gestire i locali (token di @BotFather)
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Proprietario del bot fissato (numero Telegram): solo lui crea locali e apre le statistiche
      - key: TELEGRAM_OWNER_ID
        sync: false
      # Chiave di sola lettura delle statistiche (/api/statistiche), usata solo da Claude. Senza, l'entrata è chiusa
      - key: STATS_KEY
        sync: false
      # Notifiche web della tessera (notifiche-web.js): la chiave pubblica non è segreta, la privata va inserita a mano.
      # Senza la privata le notifiche web restano spente. Non cambiarle: i clienti dovrebbero riattivare le notifiche
      - key: VAPID_PUBLIC_KEY
        value: BPs89Y98y_IO_yJFSbpu53u0YsMiRtledmCJFfTh_B20Nk2NhiOyvK1sNMti8sxfEvt5Fm38zmI4Dive9lryExI
      - key: VAPID_PRIVATE_KEY
        sync: false

databases:
  - name: pizzeria-loyalty-db
    plan: free
    region: frankfurt
